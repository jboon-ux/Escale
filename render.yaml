services:
  - type: web
    name: escale
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: GROQ_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: ESCALE_ACCESS_CODE
        sync: false
      - key: BOOKING_AFFILIATE_ID
        sync: false
